l_english:
 GAT_history_be_damned: "Breaking with the Cursed Past"
 GAT_history_be_damned_desc: "Old chronicles lie, annals are full of the poison of weakness. It is time to rewrite not just the books—it is time to rewrite reality itself. We will tear out the page on which our defeat is written and inscribe a new chapter of blood and steel. The past no longer holds us. The future belongs to Gotenland."
 GAT_Aryan_Brotherhood: "Aryan Brotherhood"
 GAT_Aryan_Brotherhood_desc: "Blood is everything. The Order has preserved racial purity for centuries, and now it is time to reap the rewards. Only true Aryans, whose ancestors set foot on this land with sword and plow, are worthy to bear the arms of Gotenland. Outsiders may work in the factories and die in the swamps, but they will not stand in the same ranks as the Knights of the Black Order."
 GAT_superiority_in_quantity: "Superiority in Numbers"
 GAT_superiority_in_quantity_desc: "Ideals are beautiful, but reality is harsh. The enemy is multifaceted and innumerable. We cannot afford the luxury of racial prejudice when the survival of Gotenland is at stake. Let the Slavs and Tatars go into battle first—they will shield us with their bodies, while true Aryans deliver the decisive blow."
 GAT_temporary_addiction: "Temporary Dependence"
 GAT_temporary_addiction_desc: "Reality intrudes even upon the purest theories. The front demands soldiers, the factories demand workers. We are forced to acknowledge that the 'subhumans' can be useful, as long as they are kept on a short leash."
 GAT_gradual_sorting: "Gradual Sorting"
 GAT_gradual_sorting_desc: "We have enlisted everyone who could hold a weapon into the army. But chaos is not order. It is time to impose discipline: the most loyal and capable 'outsiders' will receive the status of honorary Aryans. The best of the lower races can be useful if they are ideologically reconditioned."


 ###########################
 ####UNCOMPROMISING PATH####
 ###########################
 GAT_uncompromising_path: "The Uncompromising Path"
 GAT_uncompromising_path_desc: "Diplomacy is for the weak. Our ancestors came to these lands with fire and sword, and only thus shall we hold them. No negotiations with subhumans, no guarantees for traitors. Gotenland will speak the language of ultimatums and armored wedges."
 GAT_european_conflict: "European Conflict"
 GAT_european_conflict_desc: "We will ignite the flames of war across the entire continent, pitting Germany against Russia, France against Italy. Let them bleed each other dry while we gather our strength. And when they are exhausted, the Black Order will emerge from the shadows and impose its own order."


 ################################
 ####PATH OF ETERNAL PROMISES####
 ################################
 GAT_path_of_eternal_promises: "The Path of Eternal Promises"
 GAT_path_of_eternal_promises_desc: "Gotenland is not strong enough to fight the entire world. Not yet. We will wield the eternal weapon of the weak: promises, intrigues, gold. We will promise Ukrainian nationalists independence, Cossacks their liberties, Tatars autonomy. Let them tear at each other's throats while we act as the 'honest broker' and 'big brother.'"
 