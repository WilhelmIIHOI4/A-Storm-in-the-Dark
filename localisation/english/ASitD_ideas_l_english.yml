l_english:
 ASitD_GAT_idea_Dark_life: "The Living Darkness of Gotenland"
 ASitD_GAT_idea_Dark_life_desc: "Light is not synonymous with life, nor life with light. True existence lurks in twilight and shadow. The people of Gotenland draw their strength not from the sun that feeds a rotting world, but from the eternal, primordial darkness hidden in their soil and souls. Here, it is not the strongest who survive, but those who have learned to see in the dark and listen to the whisper of the night itself."
 ASitD_GAT_idea_Shadow_Reapers: "Shadow Reapers"
 ASitD_GAT_idea_Shadow_Reapers_desc: "Our secret services are not mere intelligence and counter-intelligence operatives. They are reapers, harvesting fear and ignorance. They do not operate in the darkness; they are part of it, dissolving into it as naturally as night swallows the last ray of sunset."
 ASitD_GAT_idea_Black_Earth_Autarchy: "Black Earth Autarky"
 ASitD_GAT_idea_Black_Earth_Autarchy_desc: "Our land, steeped in darkness, rejects foreign seeds and goods. Every grain of resource, every unit of production must be born here, through agony and effort. This isolation is not weakness, but a purification, ensuring that no foreign taint defiles our domain."
 ASitD_GAT_idea_history_be_damned: "To Hell with History"
 ASitD_GAT_idea_history_be_damned_desc: "Archives burn in bonfires, monuments to 'former heroes' are toppled from their pedestals. The air smells of ozone and revolutionary resolve. We have cast off the burden of past mistakes, but in doing so, have thrown the baby out with the bathwater. Social foundations are crumbling, traditional industry has lost its bearings, but the army has tasted absolute freedom. We will forge our own history, no matter how cruel it may be."
 ASitD_GAT_idea_uncompromising_path: "Mobilization for War Needs"
 ASitD_GAT_idea_path_of_eternal_promises: "Mobilization for Production Needs"
 ASitD_GAT_idea_Aryan_Brotherhood: "Aryan Army"
 ASitD_GAT_idea_superiority_in_quantity: "Army Rabble"
 GAT_idea_UKR_destabilization_2: "The South is Ours!"
 ASitD_GAT_idea_KUB_destabilization_2: "The West is Ours, Too!"
 