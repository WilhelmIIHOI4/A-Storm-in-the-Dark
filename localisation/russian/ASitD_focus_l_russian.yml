l_russian:
 GAT_history_be_damned: "Разрыв с проклятым прошлым"
 GAT_history_be_damned_desc: "Старые хроники лгут, летописи полны яда слабости. Пришло время переписать не только книги — пришло время переписать саму реальность. Мы вырвем страницу, на которой написано наше поражение, и впишем новую главу крови и стали. Прошлое больше не держит нас. Будущее принадлежит Готтенланду."
 GAT_Aryan_Brotherhood: "Арийское братство"
 GAT_Aryan_Brotherhood_desc: "Кровь — это всё. Орден веками хранил чистоту расы, и теперь пришло время пожинать плоды. Только истинные арийцы, чьи предки ступили на эту землю с мечом и плугом, достойны носить оружие Готтенланда. Чужаки могут работать на заводах и умирать в болотах, но не стоять в одном строю с рыцарями Чёрного ордена."
 GAT_superiority_in_quantity: "Превосходство количеством"
 GAT_superiority_in_quantity_desc: "Идеалы прекрасны, но реальность сурова. Враг многолик и бесчислен. Мы не можем позволить себе роскошь расовых предрассудков, когда на кону стоит выживание Готтенланда. Пусть славяне и татары идут в бой первыми — они прикроют нас своими телами, а истинные арийцы нанесут решающий удар."
 GAT_temporary_addiction: "Временное привыкание"
 GAT_temporary_addiction_desc: "Реальность вторгается даже в самые чистые теории. Фронт требует солдат, заводы — рабочих. Мы вынуждены признать, что "неполноценные" могут быть полезны, если держать их на коротком поводке."
 GAT_gradual_sorting: "Постепенная сортировка"
 GAT_gradual_sorting_desc: "Мы набрали в армию всех, кто мог держать оружие. Но хаос — не порядок. Пришло время навести дисциплину: наиболее преданные и способные "чужаки" получат статус почётных арийцев. Лучшие из низших рас могут быть полезны, если их идеологически обработать."
 
 
 ###########################
 ####UNCOMPROMISING PATH####
 ###########################
 GAT_uncompromising_path: "Бескомпромиссный путь"
 GAT_uncompromising_path_desc: "Дипломатия — удел слабых. Наши предки пришли в эти земли с огнём и мечом, и только так мы удержим их. Никаких переговоров с недочеловеками, никаких гарантий предателям. Готтенланд будет говорить на языке ультиматумов и танковых клиньев."
 GAT_european_conflict: "Европейский конфликт"
 GAT_european_conflict_desc: "Мы разожжём пламя войны на всём континенте, столкнём лбами Германию и Россию, Францию и Италию. Пусть они истекут кровью, пока мы копим силы. А когда они выдохнутся, Чёрный орден выйдет из тени и наведёт свой порядок."
 
 
 ################################
 ####PATH OF ETERNAL PROMISES####
 ################################
 GAT_path_of_eternal_promises: "Путь вечных обещаний"
 GAT_path_of_eternal_promises_desc: "Готтенланд не настолько силён, чтобы воевать со всем миром. Пока — не настолько. Мы будем использовать извечное оружие слабых: обещания, интриги, золото. Посулим украинским националистам независимость, казакам — вольности, татарам — автономию. Пусть они грызутся между собой, а мы выступим в роли "честного посредника" и "старшего брата"."
 