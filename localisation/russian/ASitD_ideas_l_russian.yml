l_russian:
 ASitD_GAT_idea_Dark_life: "Жизненная тьма Готтенланда"
 ASitD_GAT_idea_Dark_life_desc: "Свет не является синонимом жизни, а жизнь — не синонимом света. Истинное бытие таится в сумерках и тени. Народ Готтенланда черпает силу не из солнца, питающего гниющий мир, а из вечной, первозданной тьмы, что скрывается в его земле и душах. Здесь выживает не сильнейший, а тот, кто научился видеть впотьмах и слушать шёпот самой ночи."
 ASitD_GAT_idea_Shadow_Reapers: "Жнецы теней"
 ASitD_GAT_idea_Shadow_Reapers_desc: "Наши спецслужбы — не просто разведчики и контрразведчики. Они — жнецы, собирающие урожай страха и неведения. Они действуют не в темноте, а являются её частью, растворяясь в ней так же естественно, как ночь поглощает последний луч заката."
 ASitD_GAT_idea_Black_Earth_Autarchy: "Автаркия Чёрной Земли"
 ASitD_GAT_idea_Black_Earth_Autarchy_desc: "Наша земля, пропитанная тьмой, отвергает чужеземные семена и товары. Каждая крупица ресурса, каждая единица продукции должна быть рождена здесь, в муках и усилии. Эта изоляция — не слабость, а очищение, гарантирующее, что ни одна чужая скверна не осквернит наше пространство."
 ASitD_GAT_idea_history_be_damned: "К чёрту эту историю"
 ASitD_GAT_idea_history_be_damned_desc: "Архивы горят в пламени костров, памятники "прежним героям" сброшены с пьедесталов. В воздухе витает запах озона и революционной решимости. Мы отказались от бремени прошлых ошибок, но вместе с водой выплеснули и ребенка. Социальные устои шатаются, традиционная промышленность лишилась ориентиров, зато армия почувствовала вкус абсолютной свободы. Мы сами будем творить свою историю, какой бы жестокой она ни была."
 ASitD_GAT_idea_uncompromising_path: "Рост на военные нужды"
 ASitD_GAT_idea_path_of_eternal_promises: "Рост на производственные нужды"
 ASitD_GAT_idea_Aryan_Brotherhood: "Арийская армия"
 ASitD_GAT_idea_superiority_in_quantity: "Армейский сброд"
 GAT_idea_UKR_destabilization_2: "Юг - наш!"
 ASitD_GAT_idea_KUB_destabilization_2: "Запад - тоже наш!"
 